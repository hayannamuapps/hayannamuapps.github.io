<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RouteTracker</title>
  <link rel="icon" href="route_tracker.png" type="image/png">
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 30px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .header img {
      width: 60px;
      height: 60px;
    }

    .header span {
      font-size: 28px;
      font-weight: bold;
    }

    .subtext {
      font-size: 20px;
      color: #666;
      text-align: center;
      max-width: 80%;
      line-height: 1.6;
      margin-top: 10px;
    }

    .download-button {
      margin-top: 50px;
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .links ul {
      list-style: none;
      padding: 0;
      margin: 0;
      text-align: center;
    }

    .links li {
      margin-bottom: 5px;
    }

    .footer {
      text-align: center;
      padding: 16px 0;
      font-size: 13px;
      color: #555;
    }

    .footer a {
      color: #555;
      text-decoration: none;
      margin: 0 8px;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .header span {
        font-size: 22px;
      }

      .header img {
        width: 48px;
        height: 48px;
      }

      .subtext {
        font-size: 16px;
        max-width: 80%;
        margin-top: 10px;
      }

      .download-button a img {
        width: 160px;
      }

      .footer {
        font-size: 12px;
        padding: 12px 10px;
      }
    }
  </style>
</head>
<body>

  <div class="content">
    <div class="header">
      <img src="route_tracker.png" alt="App Icon">
      <span>RouteTracker</span>
    </div>
    <div class="subtext">You can plan and record a variety of outdoor activities</div>
    <div class="download-button">
      <a href="https://play.google.com/store/apps/details?id=com.hayannamuapps.route_tracker" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Get it on Google Play">
      </a>
    </div>
  </div>

  <div class="footer">
    © <span id="year"></span> RouteTracker. All rights reserved.<br>
    <a href="terms.html">Terms of Use</a> | <a href="privacy.html">Privacy Policy</a>
  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

</body>
</html>
