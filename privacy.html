<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RouteTracker</title>
  <link rel="icon" href="route_tracker.png" type="image/png">
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 30px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .header img {
      width: 60px;
      height: 60px;
    }

    .header span {
      font-size: 28px;
      font-weight: bold;
    }

    .subtext {
      font-size: 20px;
      color: #666;
      text-align: center;
      max-width: 80%;
      line-height: 1.6;
      margin-top: 10px;
    }

    .links ul {
      list-style: none;
      padding: 0;
      margin: 0;
      text-align: center;
    }

    .links li {
      margin-top: 10px;
      margin-bottom: 5px;
    }

    .footer {
      text-align: center;
      padding: 16px 0;
      font-size: 13px;
      color: #555;
    }

    .footer a {
      color: #555;
      text-decoration: none;
      margin: 0 8px;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .header span {
        font-size: 22px;
      }

      .header img {
        width: 48px;
        height: 48px;
      }

      .subtext {
        font-size: 16px;
        max-width: 80%;
        margin-top: 10px;
      }

      .footer {
        font-size: 12px;
        padding: 12px 10px;
      }
    }
  </style>
</head>
<body>

  <div class="content">
    <div class="header">
      <img src="route_tracker.png" alt="App Icon">
      <span>RouteTracker</span>
    </div>

    <div class="links">
      <ul>
        <li><a href="privacy_policy_en.html">Privacy Policy (English)</a></li>
        <li><a href="privacy_policy_ko.html">개인 정보 처리 방침 (한국어)</a></li>
      </ul>
    </div>
  </div>

  <div class="footer">
    © <span id="year"></span> RouteTracker. All rights reserved.
  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

</body>
</html>
